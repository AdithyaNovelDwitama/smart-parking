<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Smart Parking</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #06111f;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 1250px;
      margin: auto;
      padding: 40px 0;
    }

    /* ==============================
       HEADER
    ============================== */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .title .icon {
      font-size: 48px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8ca8c7;
      font-size: 20px;
    }

    .connection {
      border: 1px solid #23415f;
      border-radius: 30px;
      padding: 13px 22px;
      color: #a8bfd8;
      background: #0b1b2d;
    }

    .dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      background: #2bd67b;
      border-radius: 50%;
      margin-right: 8px;
    }

    /* ==============================
       SUMMARY
    ============================== */

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 40px;
    }

    .summary-card {
      background: #0b1b2d;
      border: 1px solid #23415f;
      border-radius: 20px;
      padding: 28px;
    }

    .summary-title {
      color: #8ca8c7;
      font-size: 15px;
      margin-bottom: 15px;
    }

    .summary-value {
      font-size: 38px;
      font-weight: bold;
    }

    .green {
      color: #2bd67b;
    }

    .red {
      color: #ff5b70;
    }

    /* ==============================
       SLOT
    ============================== */

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-header h2 {
      font-size: 25px;
    }

    .updated {
      color: #7291b1;
      font-size: 14px;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .slot {
      background: #0b1b2d;
      border: 1px solid #23415f;
      border-radius: 20px;
      padding: 25px;
    }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .slot-name {
      font-size: 24px;
      font-weight: bold;
    }

    .status {
      padding: 10px 15px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
    }

    .status-kosong {
      background: #063c29;
      color: #2bd67b;
    }

    .status-terisi {
      background: #46151d;
      color: #ff5b70;
    }

    .parking-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .distance {
      color: #8ca8c7;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .distance strong {
      color: white;
      font-size: 17px;
    }

    .bar {
      width: 100%;
      height: 6px;
      border-radius: 10px;
      background: #173149;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #2bd67b;
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .bar-fill.occupied {
      background: #ff5b70;
    }

    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 800px) {

      .summary {
        grid-template-columns: 1fr;
      }

      .slots {
        grid-template-columns: 1fr;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }

      h1 {
        font-size: 32px;
      }

    }

  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">

    <div>

      <div class="title">
        <div class="icon">🚗</div>

        <div>
          <h1>Smart Parking</h1>

          <div class="subtitle">
            Monitoring parkir berbasis IoT
          </div>
        </div>

      </div>

    </div>

    <div class="connection">
      <span class="dot"></span>
      ONLINE • REALTIME
    </div>

  </div>


  <!-- SUMMARY -->
  <div class="summary">

    <div class="summary-card">

      <div class="summary-title">
        TOTAL SLOT
      </div>

      <div
        class="summary-value"
        id="totalSlot"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-title">
        TERSEDIA
      </div>

      <div
        class="summary-value green"
        id="tersedia"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-title">
        TERISI
      </div>

      <div
        class="summary-value red"
        id="terisi"
      >
        0
      </div>

    </div>

  </div>


  <!-- SLOT HEADER -->
  <div class="section-header">

    <h2>
      Status Slot Parkir
    </h2>

    <div
      class="updated"
      id="updated"
    >
      Memuat data...
    </div>

  </div>


  <!-- SLOT -->
  <div
    class="slots"
    id="slots"
  >
  </div>

</div>


<script>

  // ==================================================
  // SUPABASE
  // ==================================================

  const SUPABASE_URL =
    "https://xnedjeiqysvnfdbpicnp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_txcZ3waxFqFQZiEDusVA_oH5A20tR";


  // ==================================================
  // AMBIL DATA SUPABASE
  // ==================================================

  async function loadParkingData() {

    try {

      const url =
        SUPABASE_URL +
        "/rest/v1/parking_slots" +
        "?select=id,slot_name,status,distance" +
        "&order=id.asc";

      const response = await fetch(
        url,
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          },

          cache: "no-store"
        }
      );


      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );

      }


      const data =
        await response.json();


      console.log(
        "Data Supabase:",
        data
      );


      updateWebsite(data);


    } catch (error) {

      console.error(
        "Gagal mengambil data:",
        error
      );

      document.getElementById(
        "updated"
      ).textContent =
        "Gagal mengambil data";

    }

  }


  // ==================================================
  // UPDATE WEBSITE
  // ==================================================

  function updateWebsite(data) {

    // ------------------------------
    // SUMMARY
    // ------------------------------

    const total =
      data.length;

    const occupied =
      data.filter(
        slot =>
          slot.status === "terisi"
      ).length;

    const available =
      total - occupied;


    document.getElementById(
      "totalSlot"
    ).textContent = total;


    document.getElementById(
      "tersedia"
    ).textContent = available;


    document.getElementById(
      "terisi"
    ).textContent = occupied;


    // ------------------------------
    // SLOT
    // ------------------------------

    const slots =
      document.getElementById("slots");


    slots.innerHTML = "";


    data.forEach(slot => {

      const isOccupied =
        slot.status === "terisi";


      const statusText =
        isOccupied
          ? "TERISI"
          : "KOSONG";


      const statusClass =
        isOccupied
          ? "status-terisi"
          : "status-kosong";


      const distance =
        Number(slot.distance || 0);


      // Bar berdasarkan jarak
      let barWidth =
        Math.min(
          Math.max(
            distance / 4,
            5
          ),
          100
        );


      if (isOccupied) {
        barWidth = 100;
      }


      const card =
        document.createElement("div");


      card.className =
        "slot";


      card.innerHTML = `

        <div class="slot-header">

          <div class="slot-name">
            ${slot.slot_name}
          </div>

          <div class="status ${statusClass}">
            ${statusText}
          </div>

        </div>


        <div class="parking-icon">
          🅿️
        </div>


        <div class="distance">

          Jarak sensor:

          <strong>
            ${distance.toFixed(1)} cm
          </strong>

        </div>


        <div class="bar">

          <div
            class="bar-fill ${
              isOccupied
                ? "occupied"
                : ""
            }"
            style="width:${barWidth}%"
          ></div>

        </div>

      `;


      slots.appendChild(card);

    });


    // ------------------------------
    // WAKTU UPDATE
    // ------------------------------

    const now =
      new Date();


    document.getElementById(
      "updated"
    ).textContent =
      "Diperbarui " +
      now.toLocaleTimeString(
        "id-ID"
      );

  }


  // ==================================================
  // LOAD PERTAMA
  // ==================================================

  loadParkingData();


  // ==================================================
  // UPDATE OTOMATIS SETIAP 2 DETIK
  // ==================================================

  setInterval(
    loadParkingData,
    2000
  );

</script>

</body>
</html>
