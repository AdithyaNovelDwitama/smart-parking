<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Parking by AND</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#07111f;color:#eef6ff;min-height:100vh}
    .wrap{max-width:1100px;margin:auto;padding:28px 18px 45px}
    header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
    .brand h1{font-size:clamp(25px,4vw,38px);letter-spacing:-.8px}
    .brand p{color:#8ea4bb;margin-top:5px}
    .live{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid #1e3953;border-radius:999px;background:#0c1b2c;color:#9db4ca;font-size:13px}
    .dot{width:9px;height:9px;border-radius:50%;background:#31d17c;box-shadow:0 0 12px #31d17c}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:25px}
    .stat,.slot{background:linear-gradient(145deg,#0d1d2e,#0a1726);border:1px solid #1b344d;border-radius:18px}
    .stat{padding:20px}.stat span{display:block;color:#89a1b9;font-size:13px;margin-bottom:8px}.stat strong{font-size:31px}
    .available{color:#31d17c}.occupied{color:#ff6577}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 14px}
    .section-title h2{font-size:20px}.updated{font-size:12px;color:#71879d}
    .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .slot{padding:22px;position:relative;overflow:hidden}
    .slot-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .slot-name{font-size:19px;font-weight:700}
    .badge{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}
    .badge.free{background:#0d3326;color:#4be391}.badge.busy{background:#3a1820;color:#ff7a88}
    .status-icon{font-size:42px;margin:8px 0 12px}
    .distance{color:#8ea4bb;font-size:14px}.distance b{color:#eef6ff}
    .bar{height:5px;background:#13273b;border-radius:10px;margin-top:18px;overflow:hidden}
    .bar i{display:block;height:100%;width:100%;background:#31d17c;transition:.3s}
    .bar i.busy{background:#ff6577}
    footer{text-align:center;color:#60778e;font-size:12px;margin-top:28px}
    @media(max-width:650px){.stats{grid-template-columns:1fr}.slots{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>🚗 Smart Parking</h1>
        <p>Monitoring parkir berbasis IoT</p>
      </div>
      <div class="live"><span class="dot" id="liveDot"></span><span id="connection">Menghubungkan...</span></div>
    </header>

    <section class="stats">
      <div class="stat"><span>TOTAL SLOT</span><strong id="total">0</strong></div>
      <div class="stat"><span>TERSEDIA</span><strong class="available" id="free">0</strong></div>
      <div class="stat"><span>TERISI</span><strong class="occupied" id="busy">0</strong></div>
    </section>

    <div class="section-title">
      <h2>Status Slot Parkir</h2>
      <span class="updated" id="updated">Belum ada data</span>
    </div>
    <main class="slots" id="slots"></main>

    <footer>Smart Parking by AND • Data realtime dari Supabase</footer>
  </div>

<script>
const SUPABASE_URL = "https://xnedjeiqysvnfdbpicnp.supabase.co";
const SUPABASE_KEY = "sb_publishable_txcZ3waxfqFqFQZiEDusVA_oH5A20tR";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render(rows){
  rows.sort((a,b)=>Number(a.id)-Number(b.id));
  const busy = rows.filter(x => String(x.status).toLowerCase() === "terisi").length;
  document.getElementById("total").textContent = rows.length;
  document.getElementById("busy").textContent = busy;
  document.getElementById("free").textContent = rows.length - busy;

  document.getElementById("slots").innerHTML = rows.map(x => {
    const isBusy = String(x.status).toLowerCase() === "terisi";
    return `
      <article class="slot">
        <div class="slot-top">
          <div class="slot-name">${esc(x.slot_name || "Slot " + x.id)}</div>
          <div class="badge ${isBusy ? "busy":"free"}">${isBusy ? "TERISI":"KOSONG"}</div>
        </div>
        <div class="status-icon">${isBusy ? "🚘":"🅿️"}</div>
        <div class="distance">Jarak sensor: <b>${Number(x.distance || 0).toFixed(1)} cm</b></div>
        <div class="bar"><i class="${isBusy ? "busy":""}"></i></div>
      </article>`;
  }).join("");
  document.getElementById("updated").textContent =
    "Diperbarui " + new Date().toLocaleTimeString("id-ID");
}
async function load(){
  const {data,error} = await db.from("parking_slots").select("*").order("id");
  if(error){
    document.getElementById("connection").textContent = "Gagal membaca database";
    console.error(error); return;
  }
  document.getElementById("connection").textContent = "ONLINE • REALTIME";
  render(data || []);
}
db.channel("parking-slots-live")
  .on("postgres_changes", {event:"*", schema:"public", table:"parking_slots"}, payload => load())
  .subscribe((status) => {
    if(status === "SUBSCRIBED") document.getElementById("connection").textContent = "ONLINE • REALTIME";
  });
load();
</script>
</body>
</html>
